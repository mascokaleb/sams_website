<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samuel Masco | Photo Gallery</title>
    <meta
      name="description"
      content="Explore every photo from Samuel Masco's tournament and training sessions in a searchable, filterable gallery."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
/* =========================================================================
   Gallery Redesign — dark charcoal infinite canvas
   ========================================================================= */

:root {
  /* Brand palette — charcoal + warm cream */
  --bg: #191c23;
  --bg-deep: #11141a;
  --ink: #f0e8d7;
  --ink-muted: #c4bca9;
  --ink-dim: #6a6f7d;
  --rule: #262a33;
  --rule-strong: #323641;
  --accent: #d4a24a;           /* muted warm gold — only for active state */
  --accent-ink: #191c23;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

  /* Ripple knobs */
  --ripple-radius: 340;        /* px from cursor where effect fades out */
  --ripple-scale: 0.14;        /* peak extra scale factor */
  --ripple-lift: 28;           /* peak lift in px */
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  background:
    radial-gradient(1200px 800px at 60% 30%, #1f232b 0%, #191c23 55%, #11141a 100%) fixed;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
img { display: block; user-select: none; -webkit-user-drag: none; }

/* ---------- Floating chrome (top, filters, counter) ---------- */

.chrome {
  position: fixed;
  z-index: 200;
  pointer-events: auto;
  color: var(--ink-muted);
}

.chrome--top {
  top: 20px;
  left: 20px;
  right: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  font-family: var(--font-display);
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  font-weight: 600;
  font-size: 0.78rem;
  letter-spacing: 0.02em;
  overflow: hidden;
}
.brand-mark.has-image { background: transparent; }
.brand-mark .brand-mark-image {
  display: block;
  width: 100%;
  height: 100%;
}
.brand-mark .brand-mark-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-text {
  color: var(--ink);
  font-size: 1.02rem;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.chrome-nav {
  display: flex;
  gap: 0.2rem;
}

.chrome-nav a {
  padding: 0.5rem 0.8rem;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-dim);
  transition: color 180ms ease;
}

.chrome-nav a:hover { color: var(--ink); }
.chrome-nav a.is-active { color: var(--ink); }

/* Hamburger toggle — hidden on desktop, visible on mobile */
.chrome-nav-toggle {
  display: none;
  width: 38px;
  height: 38px;
  padding: 0;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 999px;
  color: var(--ink);
  place-items: center;
}
.chrome-nav-toggle .bars {
  display: inline-flex;
  flex-direction: column;
  gap: 4px;
  width: 16px;
}
.chrome-nav-toggle .bars span {
  display: block;
  height: 1.5px;
  background: currentColor;
  border-radius: 1px;
  transition: transform 180ms ease, opacity 180ms ease;
}
.chrome-nav-toggle[aria-expanded="true"] .bars span:nth-child(1) { transform: translateY(5.5px) rotate(45deg); }
.chrome-nav-toggle[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
.chrome-nav-toggle[aria-expanded="true"] .bars span:nth-child(3) { transform: translateY(-5.5px) rotate(-45deg); }

/* --- Filters: compact popover bar, top-center (below nav) --- */
.chrome--filters {
  top: 72px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.6rem;
  background: rgba(15, 17, 22, 0.78);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  border: 1px solid var(--rule);
  border-radius: 999px;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 10px 40px rgba(0, 0, 0, 0.45);
  max-width: calc(100vw - 40px);
}

.filter-search {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.1rem 0.6rem 0.1rem 0.55rem;
  color: var(--ink-dim);
}
.filter-search svg { flex: 0 0 auto; }
.filter-search input {
  background: transparent;
  border: 0;
  outline: none;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 0.82rem;
  width: 120px;
  padding: 0.3rem 0;
}
.filter-search input::placeholder { color: var(--ink-dim); }

.filter-divider {
  width: 1px;
  height: 20px;
  background: var(--rule-strong);
  flex: 0 0 auto;
}

.filter-group {
  position: relative;
  flex: 0 0 auto;
}

.filter-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.38rem 0.75rem;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 999px;
  color: var(--ink-muted);
  font-family: var(--font-body);
  font-size: 0.78rem;
  letter-spacing: 0.02em;
  white-space: nowrap;
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}
.filter-trigger:hover { background: rgba(255,255,255,0.03); color: var(--ink); }
.filter-trigger .trigger-label {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
}
.filter-trigger .trigger-value {
  color: var(--ink);
  font-weight: 500;
}
.filter-trigger .caret {
  width: 8px; height: 8px;
  border-right: 1.2px solid currentColor;
  border-bottom: 1.2px solid currentColor;
  transform: rotate(45deg) translateY(-2px);
  opacity: 0.6;
  transition: transform 180ms ease;
}
.filter-group.is-open .filter-trigger {
  background: rgba(255,255,255,0.05);
  color: var(--ink);
}
.filter-group.is-open .filter-trigger .caret {
  transform: rotate(225deg) translateY(-2px);
}
.filter-group.has-active:not(.filter-group--unified) .filter-trigger::after {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent);
  margin-left: 0.1rem;
}

.filter-popover {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-4px);
  min-width: 180px;
  max-width: 280px;
  padding: 0.5rem;
  background: rgba(18, 20, 26, 0.96);
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.7,.2,1);
  z-index: 5;
}
.filter-group.is-open .filter-popover {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}

.chip-row {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  max-height: 280px;
  overflow-y: auto;
}

.chip {
  padding: 0.42rem 0.7rem;
  border-radius: 8px;
  background: transparent;
  border: 0;
  color: var(--ink-muted);
  font-size: 0.78rem;
  letter-spacing: 0.01em;
  text-align: left;
  white-space: nowrap;
  transition: color 140ms ease, background 140ms ease;
  cursor: pointer;
}
.chip:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
.chip.is-active {
  color: var(--bg);
  background: var(--ink);
}

/* Unified filter popover with labeled sections and horizontal chip rows */
.filter-popover--wide {
  min-width: 260px;
  max-width: min(320px, calc(100vw - 24px));
  padding: 0.3rem;
}
.filter-section {
  padding: 0.4rem 0.4rem 0.5rem;
  border-bottom: 1px solid var(--rule);
}
.filter-section:last-of-type { border-bottom: 0; }
.filter-section-heading {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
  padding: 0.1rem 0.3rem 0.35rem;
}
.chip-row--horizontal {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 0.25rem;
  max-height: none;
}
.filter-section .chip-row--horizontal .chip {
  padding: 0.32rem 0.6rem;
  border-radius: 999px;
  background: rgba(255,255,255,0.03);
  font-size: 0.72rem;
}
.filter-section .chip-row--horizontal .chip:hover {
  background: rgba(255,255,255,0.07);
  color: var(--ink);
}
.filter-section .chip-row--horizontal .chip.is-active {
  background: var(--ink);
  color: var(--bg);
}
/* Tournament list stays as a vertical scrollable list (names get long) */
.filter-section #tournament-chips {
  max-height: 180px;
  overflow-y: auto;
}

.filter-footer {
  display: flex;
  justify-content: flex-end;
  padding: 0.4rem 0.3rem 0.15rem;
}
.filter-reset {
  background: transparent;
  border: 0;
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  padding: 0.3rem 0.5rem;
  border-radius: 6px;
  cursor: pointer;
  transition: color 140ms ease, background 140ms ease;
}
.filter-reset:hover { color: var(--ink); background: rgba(255,255,255,0.04); }
.filter-reset[hidden] { display: none; }

/* Count badge on the unified Filter trigger */
.trigger-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 16px;
  height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-mono);
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0;
}
.trigger-count[hidden] { display: none; }

/* --- Counter (top-right, under nav) --- */
.chrome--counter {
  top: 70px;
  right: 20px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.15rem;
  text-align: right;
}
.counter-kicker {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.2em;
  color: var(--ink-dim);
}
.counter-value {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--ink);
  letter-spacing: -0.01em;
}

/* ---------- The vertical-scroll stage ---------- */

.stage {
  position: relative;
  width: 100%;
  min-height: 100vh;
  padding: 140px clamp(24px, 4vw, 80px) 140px;
}

.canvas-plane {
  position: relative;
  margin: 0 auto;
  max-width: 1600px;
  width: 100%;
}

/* Vignette pinned to viewport edges — fades the top/bottom as you scroll */
.stage-vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(8,10,13,0.9) 0%, transparent 12%, transparent 88%, rgba(8,10,13,0.95) 100%);
  z-index: 5;
}

/* Empty / loading / error states */
.stage-message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: var(--ink-muted);
  font-size: 0.9rem;
  max-width: 420px;
  padding: 1rem;
}
.stage-message.error { color: #e89479; }

/* ---------- Photo tiles on the canvas ---------- */

.tile {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--w, 280px);
  height: var(--h, 380px);
  transform: translate3d(var(--x, 0px), var(--y, 0px), 0)
             translate3d(var(--rx, 0px), var(--ry, 0px), var(--rz, 0px))
             scale(var(--rs, 1));
  will-change: transform, filter;
  transition: filter 320ms ease;
  cursor: pointer;
  overflow: visible;
}

.tile-frame {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #1f232b;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.04) inset,
    0 calc(var(--shadow-lift, 0) * 1px) calc(var(--shadow-blur, 8) * 1px) rgba(0, 0, 0, 0.6),
    0 2px 6px rgba(0, 0, 0, 0.35);
  will-change: box-shadow;
}

.tile-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.35) 100%);
  opacity: 0;
  transition: opacity 280ms ease;
  pointer-events: none;
  z-index: 2;
}

.tile.is-hovered .tile-frame::after { opacity: 1; }

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 600ms cubic-bezier(.2,.7,.2,1), filter 320ms ease;
  filter: brightness(calc(0.88 + var(--brightness-boost, 0) * 0.18)) saturate(1.02);
}
.tile.is-hovered img {
  transform: scale(1.04);
  filter: brightness(1.02) saturate(1.08);
}

/* Featured halo — subtle warm outline */
.tile.is-featured .tile-frame {
  box-shadow:
    0 0 0 1px rgba(212, 162, 74, 0.4) inset,
    0 1px 0 rgba(255, 255, 255, 0.05) inset,
    0 calc(var(--shadow-lift, 0) * 1px) calc(var(--shadow-blur, 8) * 1px) rgba(0, 0, 0, 0.6),
    0 2px 6px rgba(0, 0, 0, 0.35);
}

/* Caption — hidden at rest, slides up on hover */
.tile-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 0.7rem 0.85rem 0.75rem;
  z-index: 3;
  color: var(--ink);
  transform: translateY(100%);
  transition: transform 360ms cubic-bezier(.2,.7,.2,1);
  pointer-events: none;
}
.tile.is-hovered .tile-caption { transform: translateY(0); }

.tile-caption-title {
  font-family: var(--font-display);
  font-size: 0.92rem;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.25;
  margin: 0;
}

.tile-caption-meta {
  margin-top: 0.2rem;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-muted);
}
.tile-caption-meta .dot {
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--ink-dim);
  display: inline-block;
}

/* Date chip — shows on hover */
.tile-date {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 0.3rem 0.4rem 0.28rem;
  background: rgba(8, 10, 13, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 0.52rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  line-height: 1.1;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 240ms ease, transform 240ms ease;
}
.tile.is-hovered .tile-date {
  opacity: 0.95;
  transform: translateY(0);
}
.tile-date .day {
  font-family: var(--font-display);
  font-size: 0.95rem;
  letter-spacing: -0.02em;
  font-weight: 500;
}

/* Featured badge */
.tile-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 3;
  padding: 0.25rem 0.45rem;
  background: rgba(212, 162, 74, 0.9);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 0.52rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
}

/* Entry state — tiles fade/rise in when first laid out */
.tile.is-entering {
  opacity: 0;
  transform: translate3d(var(--x, 0px), calc(var(--y, 0px) + 30px), 0) scale(0.96);
  filter: blur(8px);
}

/* ---------- Lightbox ---------- */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 300;
  pointer-events: none;
}
.lightbox.is-open {
  pointer-events: auto;
}

.lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(5, 6, 8, 0.78);
  backdrop-filter: blur(18px) saturate(120%);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
  opacity: 0;
  transition: opacity 380ms ease;
}
.lightbox.is-open .lightbox-backdrop { opacity: 1; }

.lightbox-frame {
  position: absolute;
  top: 0;
  left: 0;
  overflow: hidden;
  background: #1f232b;
  will-change: transform, width, height;
  transform-origin: 0 0;
  box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
  visibility: hidden;
  /* Delay hiding until the close morph finishes */
  transition: visibility 0s linear 420ms;
}
.lightbox.is-open .lightbox-frame {
  visibility: visible;
  /* Show immediately on open */
  transition: visibility 0s linear 0s;
}
.lightbox-frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lightbox-meta {
  position: absolute;
  z-index: 2;
  bottom: clamp(20px, 4vh, 40px);
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  max-width: min(640px, calc(100vw - 80px));
  text-align: center;
  opacity: 0;
  transition: opacity 320ms ease 120ms, transform 420ms cubic-bezier(.2,.7,.2,1) 120ms;
  pointer-events: none;
  color: var(--ink);
}
.lightbox.is-open .lightbox-meta {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.lightbox-meta-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  margin-bottom: 0.5rem;
}
.lightbox-tournament-link {
  color: var(--ink-muted);
  border-bottom: 1px solid rgba(196, 188, 169, 0.25);
  padding-bottom: 1px;
  pointer-events: auto;
  cursor: pointer;
  transition: color 160ms ease, border-color 160ms ease;
}
.lightbox-tournament-link:hover {
  color: var(--ink);
  border-bottom-color: var(--ink);
}
.lightbox-meta h2 {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 2.5vw, 1.9rem);
  font-weight: 500;
  margin: 0 0 0.4rem;
  letter-spacing: -0.015em;
  line-height: 1.15;
}
.lightbox-meta p {
  color: var(--ink-muted);
  font-size: 0.92rem;
  line-height: 1.5;
  margin: 0 0 0.55rem;
}
.lightbox-tags {
  display: flex;
  justify-content: center;
  gap: 0.3rem;
  flex-wrap: wrap;
  margin-bottom: 0.4rem;
}
.lightbox-tags .tag {
  padding: 0.2rem 0.55rem;
  border: 1px solid var(--rule-strong);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-muted);
}
.lightbox-foot {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--ink-dim);
}

.lightbox-nav {
  position: absolute;
  z-index: 2;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: rgba(15, 17, 22, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--rule-strong);
  color: var(--ink);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 280ms ease 200ms, background 200ms ease;
  cursor: pointer;
}
.lightbox.is-open .lightbox-nav { opacity: 1; }
.lightbox-nav:hover { background: rgba(34, 37, 46, 0.9); }
.lightbox-nav--prev { left: 28px; }
.lightbox-nav--next { right: 28px; }

.lightbox-close {
  position: absolute;
  z-index: 2;
  top: 24px;
  right: 24px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: rgba(15, 17, 22, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--rule-strong);
  color: var(--ink);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 280ms ease 200ms;
  cursor: pointer;
}
.lightbox.is-open .lightbox-close { opacity: 1; }

.lightbox-index {
  position: absolute;
  top: 28px;
